name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  jekyll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build strict + tangkap error
        run: |
          set +e
          bundle exec jekyll build --trace --strict_front_matter > /tmp/build.log 2>&1
          EC=$?
          echo "EXIT_CODE=$EC" >> /tmp/build.log
          cat /tmp/build.log
          echo "EXIT_CODE=$EC"
          if [ $EC -ne 0 ]; then
            cp /tmp/build.log ./ci-build-error.log
            git config user.email "ci@github.com"
            git config user.name "CI Diag"
            git add ci-build-error.log
            git commit -m "ci: build error log (auto)" || true
            git push || true
          fi
          exit 0
