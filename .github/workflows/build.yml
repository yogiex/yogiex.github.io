name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build dengan strict front matter
        run: bundle exec jekyll build --trace --strict_front_matter

      - name: Pastikan tidak ada URL satu-slash
        run: |
          hits=$(grep -rInE 'https?:/[^/]' _site --include='*.html' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "URL termangle menjadi https:/..."; exit 1; fi

      - name: Pastikan tidak ada request ke /undefined
        run: |
          hits=$(grep -rIn 'url(undefined)' _site || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi

      - name: Pastikan setiap halaman punya meta description
        run: |
          missing=$(grep -rL '<meta name="description"' _site --include='*.html' || true)
          if [ -n "$missing" ]; then echo "$missing"; echo "Halaman tanpa meta description"; exit 1; fi

      - name: Pastikan setiap halaman punya tepat satu h1
        run: |
          bad=""
          while IFS= read -r f; do
            n=$(grep -o '<h1' "$f" | wc -l)
            [ "$n" -ne 1 ] && bad="$bad$f ($n)"$'\n'
          done < <(find _site -name '*.html')
          if [ -n "$bad" ]; then printf '%s' "$bad"; exit 1; fi
